# 公開対象は専用ジェネレーターの出力だけです。
name: Publish HTML help

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: help-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build_help.js
      - run: node scripts/build_help.js --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/help-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
